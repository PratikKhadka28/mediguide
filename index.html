<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>mediguide</title>
<style>
  :root{
    --bg: #FAFAF7;
    --ink: #1B211E;
    --ink-soft: #5B655F;
    --line: #DDE3DE;
    --accent: #2F6F62;
    --accent-soft: #E7F0EC;
    --user-bg: #F0F2EF;
    --error: #B3451E;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", "Helvetica Neue", Arial, sans-serif;
  }
  *{ box-sizing: border-box; }
  html,body{
    margin:0; padding:0; height:100%;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
  }
  body{
    display:flex; flex-direction:column;
    min-height:100vh;
  }

  header{
    padding: 22px 20px 16px;
    border-bottom: 1px solid var(--line);
    max-width: 720px;
    width:100%;
    margin: 0 auto;
  }
  .brand{
    display:flex; align-items:baseline; gap:10px;
  }
  .brand h1{
    font-size: 19px;
    font-weight: 650;
    margin:0;
    letter-spacing: -0.01em;
  }
  .brand .dot{
    width:7px; height:7px; border-radius:50%;
    background: var(--accent);
    display:inline-block;
    margin-bottom: 1px;
  }
  .tagline{
    margin: 6px 0 0;
    font-size: 13.5px;
    color: var(--ink-soft);
    line-height:1.5;
    max-width: 56ch;
  }

  main{
    flex:1;
    max-width: 720px;
    width:100%;
    margin: 0 auto;
    padding: 20px 20px 140px;
    display:flex;
    flex-direction:column;
  }

  .empty{
    margin-top: 8px;
  }
  .empty p{
    font-size: 14px;
    color: var(--ink-soft);
    margin: 0 0 14px;
  }
  .suggestions{
    display:flex; flex-wrap:wrap; gap:8px;
  }
  .chip{
    border: 1px solid var(--line);
    background: none;
    color: var(--ink);
    font-family: var(--font);
    font-size: 13px;
    padding: 8px 13px;
    cursor:pointer;
    border-radius: 3px;
  }
  .chip:hover{
    border-color: var(--accent);
    color: var(--accent);
  }

  .msg{
    margin: 0 0 22px;
    max-width: 100%;
  }
  .msg .role{
    font-size: 11.5px;
    color: var(--ink-soft);
    margin-bottom: 5px;
  }
  .msg.user{
    align-self:flex-end;
  }
  .msg-row{
    display:flex;
  }
  .msg-row.user{ justify-content:flex-end; }
  .bubble{
    line-height: 1.55;
    font-size: 14.5px;
    white-space: pre-wrap;
  }
  .msg.assistant .bubble{
    border-left: 2px solid var(--accent);
    padding-left: 14px;
    max-width: 66ch;
  }
  .msg.user .bubble{
    background: var(--user-bg);
    padding: 9px 14px;
    border-radius: 3px;
    max-width: 66ch;
  }
  .msg.error .bubble{
    border-left: 2px solid var(--error);
    padding-left: 14px;
    color: var(--error);
  }

  .typing{
    display:inline-flex;
    gap:4px;
    padding-left: 14px;
    border-left: 2px solid var(--accent);
  }
  .typing span{
    width:5px; height:5px; border-radius:50%;
    background: var(--ink-soft);
    animation: blink 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2){ animation-delay: .2s; }
  .typing span:nth-child(3){ animation-delay: .4s; }
  @keyframes blink{
    0%, 80%, 100% { opacity:.25; }
    40% { opacity:1; }
  }

  form.inputbar{
    position: fixed;
    bottom:0; left:0; right:0;
    background: linear-gradient(to bottom, rgba(250,250,247,0), var(--bg) 30%);
    padding: 24px 20px 22px;
  }
  .inputbar-inner{
    max-width: 720px;
    margin: 0 auto;
    display:flex;
    gap:10px;
    align-items:flex-end;
    border: 1px solid var(--line);
    background: #fff;
    border-radius: 4px;
    padding: 6px 6px 6px 14px;
  }
  .inputbar-inner:focus-within{
    border-color: var(--accent);
  }
  textarea{
    flex:1;
    border:none;
    outline:none;
    resize:none;
    font-family: var(--font);
    font-size: 14.5px;
    line-height: 1.5;
    padding: 8px 0;
    max-height: 140px;
    background: transparent;
    color: var(--ink);
  }
  textarea::placeholder{ color: #A2ABA5; }
  button.send{
    border:none;
    background: var(--accent);
    color:#fff;
    font-family: var(--font);
    font-size: 13.5px;
    font-weight: 600;
    padding: 9px 16px;
    border-radius: 3px;
    cursor:pointer;
    flex-shrink:0;
  }
  button.send:disabled{
    background: #B7C4BE;
    cursor:default;
  }

  footer{
    text-align:center;
    font-size: 11.5px;
    color: #A2ABA5;
    padding: 10px 0 4px;
  }

  @media (max-width:520px){
    .msg.assistant .bubble, .msg.user .bubble{ max-width: 100%; }
  }
</style>
</head>
<body>

<header>
  <div class="brand"><span class="dot"></span><h1>MediGuide</h1></div>
  <p class="tagline">General information on symptoms, medicine composition, and what a medicine is typically used for. Not a diagnosis — always confirm with a doctor or pharmacist.</p>
</header>

<main id="main">
  <div class="empty" id="empty">
    <p>Ask about a condition's symptoms, or a medicine's composition and use.</p>
    <div class="suggestions">
      <button class="chip" type="button">Symptoms of typhoid</button>
      <button class="chip" type="button">What is paracetamol used for?</button>
      <button class="chip" type="button">Composition of ORS</button>
      <button class="chip" type="button">Symptoms of common cold vs flu</button>
    </div>
  </div>
  <div id="thread"></div>
</main>

<form class="inputbar" id="form">
  <div class="inputbar-inner">
    <textarea id="input" rows="1" placeholder="Ask about a symptom, disease, or medicine…"></textarea>
    <button class="send" type="submit" id="sendBtn">Ask</button>
  </div>
</form>

<script>
const thread = document.getElementById('thread');
const empty = document.getElementById('empty');
const form = document.getElementById('form');
const input = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');

let history = [];

function scrollToBottom(){
  window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
}

function addMessage(role, text){
  empty.style.display = 'none';
  const msg = document.createElement('div');
  msg.className = 'msg ' + role;
  const row = document.createElement('div');
  row.className = 'msg-row ' + role;

  const inner = document.createElement('div');
  const label = document.createElement('div');
  label.className = 'role';
  label.textContent = role === 'user' ? 'You' : 'MediGuide';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;

  inner.appendChild(label);
  inner.appendChild(bubble);
  row.appendChild(inner);
  msg.appendChild(row);
  thread.appendChild(msg);
  scrollToBottom();
  return bubble;
}

function addTyping(){
  const msg = document.createElement('div');
  msg.className = 'msg assistant';
  const row = document.createElement('div');
  row.className = 'msg-row';
  const inner = document.createElement('div');
  const label = document.createElement('div');
  label.className = 'role';
  label.textContent = 'MediGuide';
  const typing = document.createElement('div');
  typing.className = 'typing';
  typing.innerHTML = '<span></span><span></span><span></span>';
  inner.appendChild(label);
  inner.appendChild(typing);
  row.appendChild(inner);
  msg.appendChild(row);
  thread.appendChild(msg);
  scrollToBottom();
  return msg;
}

async function askMediGuide(question){
  history.push({ role: 'user', content: question });

  const typingEl = addTyping();
  sendBtn.disabled = true;

  try{
    const response = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: history })
    });

    const data = await response.json();

    if(!response.ok){
      throw new Error(data.error || 'Request failed');
    }

    const text = data.text || "I couldn't find a clear answer to that — could you rephrase it?";

    history.push({ role: 'assistant', content: text });
    typingEl.remove();
    addMessage('assistant', text);
  } catch (err){
    typingEl.remove();
    addMessage('error', "Something went wrong reaching MediGuide. Please try again.");
    history.pop();
  } finally {
    sendBtn.disabled = false;
  }
}

form.addEventListener('submit', (e) => {
  e.preventDefault();
  const q = input.value.trim();
  if(!q) return;
  addMessage('user', q);
  input.value = '';
  input.style.height = 'auto';
  askMediGuide(q);
});

input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 140) + 'px';
});

input.addEventListener('keydown', (e) => {
  if(e.key === 'Enter' && !e.shiftKey){
    e.preventDefault();
    form.requestSubmit();
  }
});

document.querySelectorAll('.chip').forEach(chip => {
  chip.addEventListener('click', () => {
    addMessage('user', chip.textContent);
    askMediGuide(chip.textContent);
  });
});
</script>

<footer>Created by Pratik Khadka</footer>

</body>
</html>
